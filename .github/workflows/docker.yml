name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and publish to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: frontend/package.json

      - name: Resolve application version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            # Forks may have no release tags. Only use an upstream tag that
            # is reachable from this commit, so old code still reports updates.
            git fetch --no-tags https://github.com/abhinavxd/libredesk.git \
              '+refs/tags/v*:refs/tags/upstream/v*'
            upstream_tag="$(git describe --tags --match 'upstream/v[0-9]*' --abbrev=0 HEAD)"
            version="${upstream_tag#upstream/}+git.$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Application version: $version"

      - name: Build application and embedded assets
        env:
          LIBREDESK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          make build
          ./libredesk --version

      - name: Prepare Docker build context
        run: |
          mkdir -p .docker-context
          cp Dockerfile config.sample.toml libredesk .docker-context/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .docker-context
          platforms: linux/amd64
          load: true
          tags: libredesk:smoke-test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=libredesk-amd64

      - name: Verify image starts
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          actual_version="$(docker run --rm libredesk:smoke-test ./libredesk --version)"
          echo "$actual_version"
          test "${actual_version%% *}" = "$EXPECTED_VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .docker-context
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=libredesk-amd64
          cache-to: type=gha,mode=max,scope=libredesk-amd64

      - name: Write image summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo '### Published Docker image (linux/amd64)'
            echo '```text'
            echo "Application version: $APP_VERSION"
            echo "$IMAGE_TAGS"
            echo "Digest: $IMAGE_DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
